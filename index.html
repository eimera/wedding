<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariage / Wedding — Marie & Augustin</title>
  <script>
    (function() {
      let savedLang = null;
      
      // Sécurité si localStorage est bloqué en mode file://
      try {
        savedLang = localStorage.getItem('user_lang');
      } catch (e) {
        console.log("localStorage indisponible en local");
      }
      
      // 1. Redirection basée sur le choix manuel précédent
      if (savedLang === 'fr' || savedLang === 'en') {
        window.location.replace('./' + savedLang + '/');
        return;
      }
      
      // 2. Sinon, redirection basée sur la langue du navigateur
      const userLang = navigator.language || navigator.userLanguage || '';
      if (userLang.startsWith('en')) {
        window.location.replace('./en/');
      } else {
        window.location.replace('./fr/');
      }
    })();
  </script>
</head>

<body>
  <!-- Message de secours si JavaScript est désactivé -->
  <p>Redirection en cours... / Redirecting...</p>
  <p>
    <a href="./fr/">Version française</a> | 
    <a href="./en/">English version</a>
  </p>
</body>
</html>
